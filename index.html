<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barça 2017 Player Wheel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barça Wheel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1230">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: one-screen tool. Wheel left, pick card + controls + history right; stacks on phones. Single dark "night match" look by choice. */
:root {
  --bg: #0b1230;
  --panel: #131c45;
  --line: #2a366e;
  --fg: #eef0fa;
  --muted: #a3abd2;
  --blau: #1d3f9c;
  --blau-2: #15307d;
  --grana: #a3134a;
  --grana-2: #85103d;
  --gold: #f2c443;
  --gold-dk: #b88a1c;
  --keeper: #1e7a4c;
  --display: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -10%, #22306a 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  padding: 24px 16px 40px;
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 32px;
  align-items: start;
}
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(26px, 4.5vw, 40px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 0;
  text-wrap: balance;
}
h1 span { color: var(--gold); }
.sub { color: var(--muted); margin: 0; }

.stage { position: relative; width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 1; }
#wheel { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; border-radius: 50%; }
#wheel:active { cursor: grabbing; }
#wheel:focus-visible { outline: 3px solid var(--gold); outline-offset: 6px; }
.pointer {
  position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 18px solid transparent; border-right: 18px solid transparent;
  border-top: 34px solid var(--gold);
  filter: drop-shadow(0 3px 3px rgba(0,0,0,.5));
  pointer-events: none;
}
.hint { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 0; }

aside { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.pick {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 18px;
  align-items: center;
  min-height: 132px;
}
.pick .num {
  grid-row: span 3;
  width: 84px; height: 96px;
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 44px;
  border-radius: 10px 10px 30px 30px;
  background: repeating-linear-gradient(90deg, var(--blau) 0 14px, var(--grana) 14px 28px);
  color: var(--gold);
  text-shadow: 0 2px 0 rgba(0,0,0,.45);
  font-variant-numeric: tabular-nums;
}
.pick .num.gk { background: var(--keeper); }
.pick .num { position: relative; overflow: hidden; }
.pick .num img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pick .num img + span { position: absolute; right: 4px; bottom: 2px; font-size: 22px; }
.pick .num img[hidden] + span { position: static; font-size: 44px; }
.list li .av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--gold); display: block; }
.pick .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pick .name { font-family: var(--display); font-weight: 700; font-size: 30px; text-transform: uppercase; line-height: 1.05; overflow-wrap: anywhere; }
.pick .pos { color: var(--gold); font-weight: 600; }
.pick.flash { animation: flash .6s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--gold); } to { box-shadow: 0 0 0 0 transparent; } }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button {
  font: inherit; font-weight: 600; cursor: pointer;
  border-radius: 10px; padding: 10px 16px;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
}
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
#spinBtn {
  background: var(--gold); color: #1a1405; border-color: var(--gold-dk);
  font-family: var(--display); font-size: 20px; letter-spacing: .06em; text-transform: uppercase;
  padding: 10px 28px; flex: 1 1 140px;
}
#spinBtn:hover:not(:disabled) { filter: brightness(1.07); }
button.ghost:hover:not(:disabled) { background: rgba(255,255,255,.06); }

.toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track {
  width: 46px; height: 26px; border-radius: 13px; flex: none;
  background: var(--line); position: relative; transition: background .2s;
}
.track::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%; background: var(--fg); transition: transform .2s;
}
.toggle input:checked + .track { background: var(--grana); }
.toggle input:checked + .track::after { transform: translateX(20px); }
.toggle input:focus-visible + .track { outline: 3px solid var(--gold); outline-offset: 2px; }
.toggle small { display: block; color: var(--muted); font-size: 13px; }

.section-title { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.list li {
  display: grid; grid-template-columns: 28px 26px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 7px 10px; border-radius: 8px; background: rgba(255,255,255,.03);
  font-variant-numeric: tabular-nums;
}
.list li .n { font-family: var(--display); font-weight: 700; color: var(--gold); text-align: right; }
.list li .p { color: var(--muted); font-size: 13px; }
.list li.out { opacity: .4; text-decoration: line-through; }
.list li button { padding: 2px 10px; font-size: 13px; border-radius: 6px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.rosters { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.done { color: var(--gold); font-weight: 600; margin: 0; }

@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .rosters { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .pick.flash { animation: none; }
  .track, .track::after { transition: none; }
}

*, *::before, *::after { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #0b1230; }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FC Barcelona <span>Starting XI</span></h1>
    <p class="sub">2017 lineup. Spin to pick a player.</p>
  </header>

  <section>
    <div class="stage">
      <canvas id="wheel" tabindex="0" aria-label="Player wheel. Press Space or Enter to spin, or drag to flick it."></canvas>
      <div class="pointer" aria-hidden="true"></div>
    </div>
    <p class="hint">Press Spin, tap the wheel, or drag and flick it.</p>
  </section>

  <aside>
    <div class="pick" id="pick" aria-live="polite">
      <div class="num" id="pickNum"><img id="pickImg" alt="" hidden><span id="pickNumTxt">?</span></div>
      <div class="label">Picked player</div>
      <div class="name" id="pickName">Ready to spin</div>
      <div class="pos" id="pickPos">11 players on the wheel</div>
    </div>

    <div class="controls">
      <button id="spinBtn" type="button">Spin</button>
      <button id="resetBtn" class="ghost" type="button">Reset</button>
    </div>

    <label class="toggle" for="removeToggle">
      <input type="checkbox" id="removeToggle">
      <span class="track" aria-hidden="true"></span>
      <span>Remove picked players
        <small>When on, each pick leaves the wheel until you reset.</small>
      </span>
    </label>

    <div class="rosters">
      <div>
        <h2 class="section-title">Squad</h2>
        <ul class="list" id="squad"></ul>
      </div>
      <div>
        <h2 class="section-title">Pick history</h2>
        <ol class="list" id="history"></ol>
        <p class="empty" id="historyEmpty">No spins yet.</p>
      </div>
    </div>
  </aside>
</div>

  function sliceColor(p, i) {
    if (p.pos === "GK") return [COLORS.keeper, COLORS.keeper];
    return i % 2 === 0 ? [COLORS.blau, COLORS.blau2] : [COLORS.grana, COLORS.grana2];
  }

  function draw() {
    const s = size, cx = s / 2, cy = s / 2;
    const rOuter = s / 2 - 4;
    const rim = Math.max(10, s * 0.035);
    const r = rOuter - rim;
    ctx.clearRect(0, 0, s, s);

    // Gold rim
    ctx.beginPath(); ctx.arc(cx, cy, rOuter, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.gold; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, rOuter - 2, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.goldDk; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, rOuter - 4, 0, Math.PI * 2);
    ctx.fillStyle = "#0a0f26"; ctx.fill();

    const n = active.length;
    if (n === 0) {
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.blau2; ctx.fill();
      ctx.fillStyle = COLORS.fg; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `700 ${Math.round(s * 0.05)}px Oswald, Arial Narrow, sans-serif`;
      ctx.fillText("ALL PICKED", cx, cy - s * 0.03);
      ctx.font = `400 ${Math.round(s * 0.032)}px Barlow, sans-serif`;
      ctx.fillText("Press Reset to refill", cx, cy + s * 0.04);
      return;
    }
    const step = (Math.PI * 2) / n;
    // Slice 0 starts at the top (pointer) before rotation
    const base = -Math.PI / 2 + rotation;

    for (let k = 0; k < n; k++) {
      const p = PLAYERS[active[k]];
      const a0 = base + k * step, a1 = a0 + step;
      const [c1, c2] = sliceColor(p, k);
      const g = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r);
      g.addColorStop(0, c2); g.addColorStop(1, c1);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a0, a1); ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = COLORS.gold; ctx.lineWidth = 1.5; ctx.stroke();

      // Name along the slice, reading outward from the face to the rim
      const mid = a0 + step / 2;
      const faceDist = r * 0.44;
      const faceR = Math.min(r * 0.155, faceDist * Math.sin(Math.min(step / 2, Math.PI / 2)) * 0.88);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(mid);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      const nameStart = r - rim * 0.6, nameEnd = faceDist + faceR + r * 0.03;
      let fs = Math.max(9, Math.min(s * 0.04, (r * step) * 0.3));
      ctx.font = `700 ${fs}px Oswald, Arial Narrow, sans-serif`;
      const label = p.name.toUpperCase();
      const w = ctx.measureText(label).width;
      if (w > nameStart - nameEnd) { fs *= (nameStart - nameEnd) / w; ctx.font = `700 ${fs}px Oswald, Arial Narrow, sans-serif`; }
      ctx.fillStyle = COLORS.fg;
      ctx.fillText(label, nameStart, 0);
      // shirt number between hub and face
      ctx.textAlign = "center";
      ctx.font = `700 ${Math.max(9, r * 0.065)}px Oswald, Arial Narrow, sans-serif`;
      ctx.fillStyle = COLORS.gold;
      ctx.fillText(String(p.num), r * 0.255, 0);
      ctx.restore();

      // Face portrait, kept upright
      const fx = cx + Math.cos(mid) * faceDist, fy = cy + Math.sin(mid) * faceDist;
      const img = faceImgs[p.name];
      ctx.save();
      ctx.beginPath(); ctx.arc(fx, fy, faceR, 0, Math.PI * 2); ctx.closePath();
      ctx.fillStyle = c2; ctx.fill();
      if (img && img.complete && img.naturalWidth) {
        ctx.clip();
        ctx.drawImage(img, fx - faceR, fy - faceR, faceR * 2, faceR * 2);
      }
      ctx.restore();
      ctx.beginPath(); ctx.arc(fx, fy, faceR, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(1.5, faceR * 0.07); ctx.strokeStyle = COLORS.gold; ctx.stroke();
    }

    // Rim studs
    const studs = 24;
    for (let i = 0; i < studs; i++) {
      const a = (i / studs) * Math.PI * 2 + rotation;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * (r + rim / 2), cy + Math.sin(a) * (r + rim / 2), rim * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.gold; ctx.fill();
    }

    // Hub
    const hr = r * 0.2;
    ctx.beginPath(); ctx.arc(cx, cy, hr, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.bg; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = COLORS.gold; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, hr - 5, 0, Math.PI * 2); ctx.clip();
    const stripe = (hr * 2) / 5;
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i % 2 === 0 ? COLORS.blau : COLORS.grana;
      ctx.fillRect(cx - hr + i * stripe, cy - hr, stripe + 0.5, hr * 2);
    }
    ctx.restore();
    ctx.fillStyle = COLORS.fg; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `700 ${Math.round(hr * 0.42)}px Oswald, Arial Narrow, sans-serif`;
    ctx.fillText("SPIN", cx, cy);
  }

  // Which active slot sits under the top pointer for the current rotation
  function slotAtPointer() {
    const n = active.length;
    const step = (Math.PI * 2) / n;
    const a = ((-rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / step) % n;
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function spin(extraVelocity) {
    if (spinning || active.length === 0) return;
    spinning = true;
    setButtons();
    const n = active.length;
    const step = (Math.PI * 2) / n;
    const target = Math.floor(Math.random() * n);
    // Land somewhere inside the target slice, away from its edges
    const within = step * (0.15 + Math.random() * 0.7);
    const desiredMod = -(target * step + within);
    const turns = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 3) + Math.min(4, Math.floor(Math.abs(extraVelocity || 0) / 8));
    const dir = (extraVelocity || 0) < 0 ? -1 : 1;
    const start = rotation;
    const TAU = Math.PI * 2;
    let end;
    if (dir > 0) {
      end = start + turns * TAU;
      end += (((desiredMod - end) % TAU) + TAU) % TAU;
    } else {
      end = start - turns * TAU;
      end -= (((end - desiredMod) % TAU) + TAU) % TAU;
    }
    const duration = reduceMotion ? 600 : 4200 + Math.random() * 1200;
    const t0 = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      rotation = start + (end - start) * easeOutCubic(t);
      draw();
      if (t < 1) requestAnimationFrame(frame);
      else finish();
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    spinning = false;
    const slot = slotAtPointer();
    const idx = active[slot];
    const p = PLAYERS[idx];
    showPick(p);
    history.unshift(idx);
    if (removeToggle.checked) {
      active.splice(slot, 1);
      draw();
    }
    renderLists();
    setButtons();
  }

  function showPick(p) {
    pickImg.src = p.face; pickImg.alt = p.name; pickImg.hidden = false;
    pickNumTxt.textContent = p.num;
    pickNum.classList.toggle("gk", p.pos === "GK");
    pickName.textContent = p.name;
    pickPos.textContent = `#${p.num} · ${POS_NAMES[p.pos] || p.pos}`;
    pickEl.classList.remove("flash"); void pickEl.offsetWidth; pickEl.classList.add("flash");
  }

  function renderLists() {
    squadEl.innerHTML = "";
    PLAYERS.forEach((p, i) => {
      const li = document.createElement("li");
      const on = active.includes(i);
      if (!on) li.classList.add("out");
      li.innerHTML = `<img class="av" src="${p.face}" alt=""><span class="n">${p.num}</span><span>${p.name}</span>`;
      const b = document.createElement("button");
      b.type = "button"; b.className = "ghost";
      b.textContent = on ? "Remove" : "Add";
      b.setAttribute("aria-label", `${on ? "Remove" : "Add"} ${p.name} ${on ? "from" : "to"} the wheel`);
      b.disabled = spinning;
      b.addEventListener("click", () => {
        if (spinning) return;
        if (on) active = active.filter(x => x !== i);
        else active = PLAYERS.map((_, j) => j).filter(j => j === i || active.includes(j));
        renderLists(); draw(); setButtons();
      });
      li.appendChild(b);
      squadEl.appendChild(li);
    });

    historyEl.innerHTML = "";
    history.slice(0, 11).forEach(idx => {
      const p = PLAYERS[idx];
      const li = document.createElement("li");
      li.innerHTML = `<img class="av" src="${p.face}" alt=""><span class="n">${p.num}</span><span>${p.name}</span><span class="p">${p.pos}</span>`;
      historyEl.appendChild(li);
    });
    historyEmpty.hidden = history.length > 0;
  }

  function setButtons() {
    spinBtn.disabled = spinning || active.length === 0;
    resetBtn.disabled = spinning;
    squadEl.querySelectorAll("button").forEach(b => b.disabled = spinning);
    if (!spinning) {
      if (active.length === 0) pickPos.textContent = "Everyone has been picked. Press Reset.";
      else if (!history.length) pickPos.textContent = `${active.length} player${active.length === 1 ? "" : "s"} on the wheel`;
    }
  }

  function reset() {
    if (spinning) return;
    active = PLAYERS.map((_, i) => i);
    history = [];
    pickImg.hidden = true; pickImg.removeAttribute("src");
    pickNumTxt.textContent = "?"; pickNum.classList.remove("gk");
    pickName.textContent = "Ready to spin";
    renderLists(); draw(); setButtons();
  }

  spinBtn.addEventListener("click", () => spin(0));
  resetBtn.addEventListener("click", reset);
  canvas.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); spin(0); }
  });

  // Drag to flick; a plain tap spins too
  let drag = null;
  function angleAt(e) {
    const r = canvas.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
  }
  canvas.addEventListener("pointerdown", e => {
    if (spinning || active.length === 0) return;
    canvas.setPointerCapture(e.pointerId);
    const a = angleAt(e);
    drag = { last: a, lastT: performance.now(), vel: 0, moved: 0 };
  });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    const a = angleAt(e);
    let d = a - drag.last;
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    const now = performance.now();
    const dt = Math.max(1, now - drag.lastT);
    drag.vel = 0.7 * drag.vel + 0.3 * (d / dt) * 1000; // rad/s
    drag.moved += Math.abs(d);
    drag.last = a; drag.lastT = now;
    rotation += d;
    draw();
  });
  function endDrag(e) {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved < 0.05) { spin(0); return; }
    if (performance.now() - d.lastT > 150) d.vel = 0;
    if (Math.abs(d.vel) > 2) spin(d.vel);
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", () => { drag = null; });

  window.addEventListener("resize", resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  renderLists();
  setButtons();
  resize();
})();
</script>
</body>
</html>
